version: '3.9'

services:
  llm-router:
    build:
      context: .
      dockerfile: Dockerfile
      # Use BuildKit for cache mounts and better builds
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: llm-router:${VERSION:-latest}
    container_name: llm-router

    ports:
      - "${PORT:-8000}:8000"

    environment:
      # Provider API Keys (set in .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}

      # Application Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-1}

      # Caching
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MAX_CACHE_SIZE: ${MAX_CACHE_SIZE:-1000}

      # Cost Tracking
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-100.0}
      BUDGET_WARNING_THRESHOLD: ${BUDGET_WARNING_THRESHOLD:-0.8}

    # Mount for persistent cache (optional)
    volumes:
      - llm-cache:/app/.cache

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Networks
    networks:
      - llm-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui

    ports:
      - "3000:8080"

    environment:
      # Point to LLM Router instead of Ollama
      OLLAMA_BASE_URL: http://llm-router:8000

      # Open WebUI configuration
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-your-secret-key-here}

      # Optional: Enable authentication
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-false}
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM:-false}

    volumes:
      - open-webui-data:/app/backend/data

    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Depends on LLM Router
    depends_on:
      llm-router:
        condition: service_healthy

    # Networks
    networks:
      - llm-network

volumes:
  llm-cache:
    driver: local
  open-webui-data:
    driver: local

networks:
  llm-network:
    driver: bridge