version: '3.9'

services:
  llm-router:
    build:
      context: .
      dockerfile: Dockerfile
      # Use BuildKit for cache mounts and better builds
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: llm-router:${VERSION:-latest}
    container_name: llm-router

    ports:
      - "${PORT:-8000}:8000"

    environment:
      # Provider API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?GOOGLE_API_KEY is required}
      XAI_API_KEY: ${XAI_API_KEY:?XAI_API_KEY is required}

      # Application Configuration
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKERS: ${WORKERS:-1}

      # Caching
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MAX_CACHE_SIZE: ${MAX_CACHE_SIZE:-1000}

      # Cost Tracking
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-100.0}
      BUDGET_WARNING_THRESHOLD: ${BUDGET_WARNING_THRESHOLD:-0.8}

    # Mount for persistent cache (optional)
    volumes:
      - llm-cache:/app/.cache

    # Restart policy
    restart: unless-stopped

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  llm-cache:
    driver: local