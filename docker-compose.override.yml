version: '3.9'

# Override file for PyCharm Services view
# This file provides additional labels and metadata for better PyCharm integration

services:
  llm-router:
    labels:
      - "com.docker.compose.project=llm-router"
      - "com.docker.compose.service=llm-router"
      - "description=LLM Router API with multi-provider support"
    environment:
      # Add PyCharm debugging support
      PYDEVD_DISABLE_FILE_VALIDATION: 1

  open-webui:
    labels:
      - "com.docker.compose.project=llm-router"
      - "com.docker.compose.service=open-webui"
      - "description=Open WebUI interface for LLM Router"
    environment:
      # Add PyCharm debugging support
      PYDEVD_DISABLE_FILE_VALIDATION: 1